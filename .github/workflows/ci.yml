---
name: CI

'on':
  push:
    branches:
      - main
      - master
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  COLLECTION_PATH: ansible_collections/mahadzar81/nagiosql
  # Both the collection under test and its dependencies must resolve from the
  # same tree, so the workspace is used as the collections root throughout.
  ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}

jobs:

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the collection
        uses: actions/checkout@v4
        with:
          path: ${{ env.COLLECTION_PATH }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the lint tooling
        run: python -m pip install --upgrade pip yamllint 'ansible-lint>=24.0.0' ansible-core

      - name: Install the collection dependencies
        working-directory: ${{ env.COLLECTION_PATH }}
        run: ansible-galaxy collection install -r requirements.yml

      - name: Run yamllint
        working-directory: ${{ env.COLLECTION_PATH }}
        run: yamllint .

      - name: Run ansible-lint
        working-directory: ${{ env.COLLECTION_PATH }}
        run: ansible-lint

  build:
    name: Build the collection artifact
    runs-on: ubuntu-latest
    steps:
      - name: Check out the collection
        uses: actions/checkout@v4
        with:
          path: ${{ env.COLLECTION_PATH }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ansible-core
        run: python -m pip install --upgrade pip ansible-core

      - name: Build the collection
        working-directory: ${{ env.COLLECTION_PATH }}
        run: ansible-galaxy collection build --output-path ./dist

      - name: Upload the collection artifact
        uses: actions/upload-artifact@v4
        with:
          name: collection-tarball
          path: ${{ env.COLLECTION_PATH }}/dist/*.tar.gz

  molecule:
    name: Molecule (${{ matrix.distro }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs:
      - lint
    strategy:
      fail-fast: false
      matrix:
        distro:
          - rockylinux8
          - rockylinux9
          - rockylinux10
          - debian12
          - debian13
          - ubuntu2204
          - ubuntu2404

    steps:
      - name: Check out the collection
        uses: actions/checkout@v4
        with:
          path: ${{ env.COLLECTION_PATH }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # EL 8 ships Python 3.6 as /usr/bin/python3, and its dnf bindings exist
      # only for that interpreter, so a newer Python cannot be substituted.
      # ansible-core 2.17+ emits modules using `from __future__ import
      # annotations`, which needs Python 3.7+, so EL 8 managed nodes require
      # ansible-core 2.16 -- the last release that can target Python 3.6.
      - name: Install the test tooling
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ "${{ matrix.distro }}" = "rockylinux8" ]; then
            ANSIBLE_CORE='ansible-core>=2.16,<2.17'
          else
            ANSIBLE_CORE='ansible-core>=2.18'
          fi
          python -m pip install "${ANSIBLE_CORE}" \
            'molecule>=6.0' 'molecule-plugins[docker]' docker

      - name: Install the collection dependencies
        working-directory: ${{ env.COLLECTION_PATH }}
        run: |
          set -euo pipefail
          if [ "${{ matrix.distro }}" = "rockylinux8" ]; then
            # community.general 12.0.0 raised its floor to ansible-core 2.17.
            ansible-galaxy collection install \
              'community.general:>=8.0.0,<12.0.0' ansible.posix ansible.mysql
          else
            ansible-galaxy collection install -r requirements.yml
          fi

      # MariaDB will not start inside a container while the host AppArmor
      # profile is loaded. See geerlingguy/ansible-role-mysql#422.
      - name: Disable the host AppArmor profile for mysqld
        if: startsWith(matrix.distro, 'debian') || startsWith(matrix.distro, 'ubuntu')
        run: |
          set -x
          sudo apt-get update
          sudo apt-get install -y apparmor-profiles
          sudo ln -sf /etc/apparmor.d/usr.sbin.mysqld /etc/apparmor.d/disable/ || true
          sudo apparmor_parser -R /etc/apparmor.d/usr.sbin.mysqld || true

      - name: Run the Molecule test sequence
        working-directory: ${{ env.COLLECTION_PATH }}/extensions
        run: molecule test --scenario-name default
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
          MOLECULE_DISTRO: ${{ matrix.distro }}
