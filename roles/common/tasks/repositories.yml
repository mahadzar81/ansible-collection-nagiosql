---
- name: Refresh the apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  changed_when: false
  when: ansible_facts.os_family == 'Debian'

# `ansible.builtin.package` is used rather than `ansible.builtin.dnf` because
# EL 10 ships dnf5, whose Python bindings the dnf4 module cannot import.
- name: Install the EPEL release package
  ansible.builtin.package:
    name: "https://dl.fedoraproject.org/pub/epel/epel-release-latest-{{ ansible_facts.distribution_major_version }}.noarch.rpm"
    state: present
    disable_gpg_check: true
  when:
    - ansible_facts.os_family == 'RedHat'
    - nagiosql_manage_epel | bool

# The repository file is edited directly rather than through
# `dnf config-manager`. That sub-command needs a plugin package whose name and
# syntax differ across the EL generations: `dnf-plugins-core` with
# `--set-enabled` on dnf4 (EL 8 and 9), and a `setopt` form on dnf5 (EL 10),
# where the plugin is not packaged for Rocky Linux at all. Setting `enabled=1`
# in the .repo file is what either command does, and it behaves identically
# everywhere.
- name: Enable the CodeReady Builder repository
  when:
    - ansible_facts.os_family == 'RedHat'
    - nagiosql_manage_crb | bool
    - nagiosql_crb_repo | length > 0
  block:
    - name: Locate the repository file defining the CodeReady Builder repository
      ansible.builtin.find:
        paths: /etc/yum.repos.d
        patterns: "*.repo"
        contains: "^\\[{{ nagiosql_crb_repo }}\\]$"
      register: nagiosql_crb_repo_file

    - name: Fail when the CodeReady Builder repository cannot be found
      ansible.builtin.fail:
        msg: >-
          No file under /etc/yum.repos.d defines a [{{ nagiosql_crb_repo }}]
          repository. Set nagiosql_crb_repo to the correct id for this system
          (on RHEL it is codeready-builder-for-rhel-{{ ansible_facts.distribution_major_version }}-<arch>-rpms),
          or set nagiosql_manage_crb to false if the -devel packages are
          already reachable.
      when: nagiosql_crb_repo_file.matched | int == 0

    - name: Enable the CodeReady Builder repository
      community.general.ini_file:
        path: "{{ nagiosql_crb_repo_file.files[0].path }}"
        section: "{{ nagiosql_crb_repo }}"
        option: enabled
        value: "1"
        no_extra_spaces: true
        owner: root
        group: root
        mode: "0644"
