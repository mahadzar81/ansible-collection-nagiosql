---
role_name_check: 1

dependency:
  name: galaxy
  options:
    requirements-file: ../../../requirements.yml

driver:
  name: docker

platforms:
  - name: "nagiosql-${MOLECULE_DISTRO:-rockylinux9}"
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-rockylinux9}-ansible:latest"
    command: "${MOLECULE_DOCKER_COMMAND:-/usr/sbin/init}"
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true

provisioner:
  name: ansible
  config_options:
    defaults:
      # community.general.yaml was removed in community.general 12.0.0. The
      # supported equivalent is the core default callback in YAML mode.
      stdout_callback: ansible.builtin.default
      result_format: yaml
      callbacks_enabled: ansible.posix.profile_tasks
  inventory:
    group_vars:
      all:
        nagiosql_db_password: "molecule-db-secret"
        nagiosql_admin_password: "molecule-admin-secret"
        nagiosql_web_users:
          - username: nagiosadmin
            password: "molecule-web-secret"

verifier:
  name: ansible

scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
