---
- name: Prepare
  hosts: all
  # No become: the test containers already run as root, and sudo is broken in
  # the Rocky Linux base images on docker-ce and GitHub Actions runners.
  # See rocky-linux/sig-cloud-instance-images#56, still open upstream. The
  # user-facing playbook in playbooks/ keeps become: true.
  become: false
  gather_facts: true
  tasks:
    - name: Refresh the apt cache
      ansible.builtin.apt:
        update_cache: true
      changed_when: false
      when: ansible_facts.os_family == 'Debian'

    - name: Install the packages the container image is missing
      ansible.builtin.package:
        name: "{{ __prepare_packages }}"
        state: present
      vars:
        __prepare_packages: >-
          {{ ['iproute2', 'procps', 'ca-certificates']
             if ansible_facts.os_family == 'Debian'
             else ['iproute', 'procps-ng', 'ca-certificates'] }}
