---
- name: Verify
  hosts: all
  become: true
  gather_facts: true
  vars:
    nagiosql_web_password: "molecule-web-secret"
  tasks:
    - name: Collect the state of the services that must be running
      ansible.builtin.service_facts:

    - name: Assert that Nagios Core, Apache and MariaDB are running
      ansible.builtin.assert:
        that:
          - ansible_facts.services[item + '.service'].state == 'running'
        fail_msg: "{{ item }} is not running"
      loop:
        - nagios
        - "{{ 'httpd' if ansible_facts.os_family == 'RedHat' else 'apache2' }}"
        - mariadb

    - name: Assert that the Nagios binary and a plugin were installed
      ansible.builtin.stat:
        path: "{{ item }}"
      register: nagiosql_verify_files
      failed_when: not nagiosql_verify_files.stat.exists
      loop:
        - /usr/local/nagios/bin/nagios
        - /usr/local/nagios/libexec/check_ping
        - /usr/local/nagios/etc/nagios.cfg
        - /var/www/html/webadmin/index.php

    - name: Validate the generated Nagios configuration
      ansible.builtin.command:
        cmd: /usr/local/nagios/bin/nagios -v /usr/local/nagios/etc/nagios.cfg
      changed_when: false

    - name: Fetch the Nagios Core web interface
      ansible.builtin.uri:
        url: http://localhost/nagios/
        user: nagiosadmin
        password: "{{ nagiosql_web_password }}"
        force_basic_auth: true
        return_content: true
      register: nagiosql_verify_core
      failed_when: "'Nagios' not in nagiosql_verify_core.content"

    # Fetched without failing so the web server log can be surfaced first. A
    # PHP fatal error returns an empty 500 body, which on its own says nothing
    # about the cause.
    - name: Fetch the NagiosQL web interface
      ansible.builtin.uri:
        url: http://localhost/webadmin/
        return_content: true
        status_code: [200, 302, 500]
      register: nagiosql_verify_ui

    - name: Report the PHP configuration in use
      ansible.builtin.command:
        cmd: php --version
      changed_when: false
      register: nagiosql_verify_php
      when: nagiosql_verify_ui.status != 200

    - name: Read the tail of the web server error log
      ansible.builtin.command:
        cmd: "tail -n 60 {{ __nagiosql_error_log }}"
      vars:
        __nagiosql_error_log: >-
          {{ '/var/log/httpd/error_log'
             if ansible_facts.os_family == 'RedHat'
             else '/var/log/apache2/error.log' }}
      changed_when: false
      register: nagiosql_verify_log
      when: nagiosql_verify_ui.status != 200

    - name: Show why the NagiosQL web interface failed
      ansible.builtin.debug:
        msg: >-
          {{ [nagiosql_verify_php.stdout | default('php --version unavailable')]
             + (nagiosql_verify_log.stdout_lines | default(['error log unavailable'])) }}
      when: nagiosql_verify_ui.status != 200

    - name: Assert that the NagiosQL web interface responds
      ansible.builtin.assert:
        that:
          - nagiosql_verify_ui.status in [200, 302]
        fail_msg: >-
          NagiosQL returned HTTP {{ nagiosql_verify_ui.status }}. See the error
          log output in the preceding task for the underlying cause.

    - name: Assert that the NagiosQL schema was imported
      ansible.mysql.mysql_query:
        login_db: db_nagiosql_v350
        query: "SHOW TABLES LIKE 'tbl_configtarget'"
        login_unix_socket: "{{ '/var/lib/mysql/mysql.sock' if ansible_facts.os_family == 'RedHat' else '/run/mysqld/mysqld.sock' }}"
        login_user: root
      register: nagiosql_verify_schema
      changed_when: false
      failed_when: nagiosql_verify_schema.rowcount[0] | int != 1
